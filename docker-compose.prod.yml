services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-backend
    env_file: /home/kistamet/services/wms/.env
    networks:
      - proxy
    ports:
      - "127.0.0.1:8000:8000"   # bind localhost only, nginx จะ proxy ต่อ
    restart: unless-stopped

networks:
  proxy:
    external: true   # network นี้สร้างไว้แล้วบน server, shared กับ postgres/redis
