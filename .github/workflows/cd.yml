name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    # self-hosted runner รันตรงบน home-server — ไม่ต้อง SSH, ไม่ต้องเปิด port
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd ~/app/WMS
          git fetch origin main
          git reset --hard origin/main

      - name: Build and restart backend
        run: |
          docker compose -f ~/app/WMS/docker-compose.prod.yml build --no-cache backend
          docker compose -f ~/app/WMS/docker-compose.prod.yml up -d backend

      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost:8000/health
          echo "Deploy complete!"
